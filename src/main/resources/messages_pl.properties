migration.workoutReport.description=Zobacz dokładnie, co zostałoby wysłane do Strava dla każdego treningu — nazwę, dyscyplinę, opis, daty, sprzęt — niezależnie od tego, czy trening wciąż czeka na migrację, czy już został zmigrowany (z linkiem prosto do aktywności na Strava). Samo planowanie nigdy nie łączy się z siecią; dla już zmigrowanego treningu, gdy jesteś połączony ze Strava, sprzęt jest odczytywany i potwierdzany, a nie tylko planowany.
