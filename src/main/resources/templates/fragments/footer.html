<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <title>Footer templating fragment</title>
</head>
<body>

<footer class="border-top py-3 mt-5" th:fragment="footer">
    <div class="container text-body-secondary small">
        <span th:text="#{footer.copyright}"/>, <span th:text="#{application.name}" />, v<span th:text="#{application.version}" />.
    </div>
</footer>

</body>
</html>
