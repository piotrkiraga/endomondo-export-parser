<html xmlns:th="http://www.w3.org/1999/xhtml">
<!-- Shared page head: the Bootstrap version below is the single place it is defined. -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.7/css/bootstrap.min.css}">
    <script>
        document.documentElement.setAttribute('data-bs-theme',
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <title th:text="${title}">Endomondo Export Parser</title>
</head>
</html>
