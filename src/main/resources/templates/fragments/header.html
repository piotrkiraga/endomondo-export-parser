<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <title>Header templating fragment</title>
</head>
<body>

<section th:fragment="header(title)">
    <nav class="navbar navbar-expand bg-body-tertiary border-bottom mb-4">
        <div class="container">
            <a class="navbar-brand" href="/home" th:text="#{application.name}">Endomondo Export Parser</a>
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/home"><span th:text="#{title.home}">Home view</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/upload"><span th:text="#{title.upload}">Upload view</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/migration/photo-report"><span th:text="#{title.migrationPhotoReport}">Photo report</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/migration/workout-report"><span th:text="#{title.migrationWorkoutReport}">Workout report</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/migration/review"><span th:text="#{title.migrationReview}">Migration review</span></a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="?lang=en"><span th:text="#{language.en}">English</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="?lang=pl"><span th:text="#{language.pl}">Polski</span></a>
                </li>
                <li class="nav-item">
                    <button id="theme-toggle" type="button" class="nav-link d-flex align-items-center"
                            th:attr="aria-label=#{theme.toggle}"
                            aria-label="Switch between light and dark mode">
                        <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
                            <path d="M13.73 12.02A7 7 0 1 1 3.99 2.27A10.1 10.1 0 0 0 13.73 12.02Z"/>
                        </svg>
                    </button>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <h2 class="mb-4" th:text="${title}"/>
    </div>
</section>

</body>
</html>
