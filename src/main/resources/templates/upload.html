<html xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head(#{title.upload})}"></head>
<body>

<div th:replace="~{fragments/header :: header(#{title.upload})}"/>

<section class="my-5">
    <div class="container">
        <div class="row">
            <div class="col-md-10 mx-auto">

                <span th:replace="~{fragments/messages-errors}"/>

                <div class="card mb-4">
                    <div class="card-body">
                        <form th:action="@{/upload/process}" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="file" class="form-label" th:text="#{form.upload.file.label}">File containing Endomondo activity export in JSON format:</label>
                                <input type="file" name="file" id="file" class="form-control"/>
                            </div>
                            <button type="submit" class="btn btn-primary" th:text="#{form.upload.submit}">Submit</button>
                        </form>
                    </div>
                </div>

                <div th:if="${summary != null}" class="card my-4">
                    <div class="card-body">
                        <h5 class="card-title mb-3" th:text="#{summary.header}">Workout summary</h5>
                        <div class="detail-list">
                            <div class="detail-row"><span class="detail-label" th:text="#{summary.name}">Name</span><span class="detail-value" th:text="${summary.name} ?: #{summary.absent}"></span></div>
                            <div class="detail-row"><span class="detail-label" th:text="#{summary.sport}">Sport</span><span class="detail-value" th:text="${summary.sport} ?: #{summary.absent}"></span></div>
                            <div class="detail-row"><span class="detail-label" th:text="#{summary.source}">Source</span><span class="detail-value" th:text="${summary.source} ?: #{summary.absent}"></span></div>
                            <div class="detail-row"><span class="detail-label" th:text="#{summary.startTime}">Start time</span><span class="detail-value" th:text="${summary.startTime} ?: #{summary.absent}"></span></div>
                            <div class="detail-row"><span class="detail-label" th:text="#{summary.duration}">Duration</span><span class="detail-value" th:text="${summary.duration} ?: #{summary.absent}"></span></div>
                            <div class="detail-row"><span class="detail-label" th:text="#{summary.distance}">Distance (km)</span><span class="detail-value" th:text="${summary.distanceKm} ?: #{summary.absent}"></span></div>
                            <div class="detail-row"><span class="detail-label" th:text="#{summary.calories}">Calories (kcal)</span><span class="detail-value" th:text="${summary.caloriesKcal} ?: #{summary.absent}"></span></div>
                            <div class="detail-row"><span class="detail-label" th:text="#{summary.speedAvg}">Average speed (km/h)</span><span class="detail-value" th:text="${summary.speedAvgKmh} ?: #{summary.absent}"></span></div>
                            <div class="detail-row"><span class="detail-label" th:text="#{summary.speedMax}">Maximum speed (km/h)</span><span class="detail-value" th:text="${summary.speedMaxKmh} ?: #{summary.absent}"></span></div>
                            <div class="detail-row"><span class="detail-label" th:text="#{summary.altitudeMin}">Minimum altitude (m)</span><span class="detail-value" th:text="${summary.altitudeMinM} ?: #{summary.absent}"></span></div>
                            <div class="detail-row"><span class="detail-label" th:text="#{summary.altitudeMax}">Maximum altitude (m)</span><span class="detail-value" th:text="${summary.altitudeMaxM} ?: #{summary.absent}"></span></div>
                            <div class="detail-row"><span class="detail-label" th:text="#{summary.points}">GPS points</span><span class="detail-value" th:text="${summary.pointCount}"></span></div>
                            <div class="detail-row"><span class="detail-label" th:text="#{summary.pointsWithLocation}">Points with full location</span><span class="detail-value" th:text="${summary.pointsWithLocationCount}"></span></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"/>

</body>
</html>
