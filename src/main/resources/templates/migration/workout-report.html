<html xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head(#{title.migrationWorkoutReport})}"></head>
<body>

<div th:replace="~{fragments/header :: header(#{title.migrationWorkoutReport})}"/>

<section class="my-5">
    <div class="container">
        <div class="row">
            <div class="col-md-10 mx-auto">

                <span th:replace="~{fragments/messages-errors}"/>

                <div class="mb-4">
                    <span th:replace="~{fragments/strava-status :: strava-status}"/>
                </div>

                <p th:text="#{migration.workoutReport.description}">
                    See exactly what would be sent to Strava for every workout, whether it's still pending or
                    already migrated.
                </p>

                <div th:unless="${archivePresent}" class="alert alert-warning"
                     th:text="#{migration.photoReport.archiveMissing(${archiveRoot})}">
                    Archive not found
                </div>

                <form th:if="${archivePresent}" th:action="@{/migration/workout-report/generate}" method="post">
                    <button type="submit" class="btn btn-primary" th:text="#{migration.workoutReport.generate}">
                        Generate report
                    </button>
                </form>

                <p class="mt-3" th:if="${workoutReportPresent}">
                    <a th:href="@{/workout-report/index.html}" target="_blank" rel="noopener"
                       th:text="#{migration.workoutReport.open}">Open report</a>
                </p>

            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"/>

</body>
</html>
