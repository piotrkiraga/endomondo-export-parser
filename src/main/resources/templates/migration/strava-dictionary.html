<html xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head(#{title.stravaDictionary})}"></head>
<body>

<div th:replace="~{fragments/header :: header(#{title.stravaDictionary})}"/>

<section class="my-5">
    <div class="container">
        <div class="row">
            <div class="col-md-10 mx-auto">

                <span th:replace="~{fragments/messages-errors}"/>

                <div class="mb-4">
                    <span th:replace="~{fragments/strava-status :: strava-status}"/>
                </div>

                <p th:text="#{migration.stravaDictionary.description}">
                    Cache Strava's rarely-changing data — your profile and every bike/shoe's name — with one call,
                    instead of looking each one up individually.
                </p>

                <form th:action="@{/migration/strava-dictionary/refresh}" method="post">
                    <button type="submit" class="btn btn-primary" th:text="#{migration.stravaDictionary.refresh}">
                        Refresh from Strava
                    </button>
                </form>

                <div th:if="${snapshot == null}" class="alert alert-secondary mt-3"
                     th:text="#{migration.stravaDictionary.neverRefreshed}">
                    Never refreshed yet.
                </div>

                <div th:if="${snapshot != null}" class="card mt-3">
                    <div class="card-body">

                        <h5 class="card-title" th:text="#{migration.stravaDictionary.athleteHeading}">Athlete</h5>
                        <p class="text-body-secondary small"
                           th:text="#{migration.stravaDictionary.refreshedAt(${refreshedAtDisplay})}">
                            Refreshed at ...
                        </p>
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <img th:if="${snapshot.profilePictureUrl != null}" th:src="${snapshot.profilePictureUrl}"
                                 alt="" style="width:62px;height:62px;border-radius:50%">
                            <div>
                                <div th:text="${snapshot.firstname} + ' ' + ${snapshot.lastname}">Name</div>
                                <div class="text-body-secondary small" th:if="${snapshot.location() != null}"
                                     th:text="${snapshot.location()}">
                                    City, Country
                                </div>
                            </div>
                        </div>

                        <h5 class="card-title" th:text="#{migration.stravaDictionary.gearHeading}">Gear</h5>
                        <div th:if="${#maps.isEmpty(snapshot.gearNames)}" class="text-body-secondary"
                             th:text="#{migration.stravaDictionary.noGear}">
                            No bikes or shoes on this account.
                        </div>
                        <table th:unless="${#maps.isEmpty(snapshot.gearNames)}" class="table table-sm">
                            <thead>
                            <tr>
                                <th th:text="#{migration.stravaDictionary.gearName}">Name</th>
                                <th th:text="#{migration.stravaDictionary.gearId}">Id</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="entry : ${snapshot.gearNames}">
                                <td th:text="${entry.value}">Name</td>
                                <td th:text="${entry.key}">Id</td>
                            </tr>
                            </tbody>
                        </table>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"/>

</body>
</html>
