<html xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head(#{title.migrationReviewSummary})}"></head>
<body>

<div th:replace="~{fragments/header :: header(#{title.migrationReviewSummary})}"/>

<section class="my-5">
    <div class="container">
        <div class="row">
            <div class="col-md-10 mx-auto">

                <p class="lead" th:text="#{migration.review.summary.description}">A tally of what happened across this review session.</p>

                <div th:unless="${archivePresent}" class="alert alert-warning"
                     th:text="#{migration.photoReport.archiveMissing(${archiveRoot})}">
                    Archive not found
                </div>

                <div th:if="${archivePresent}">

                    <div class="card mb-4">
                        <div class="card-body">
                            <h5 class="card-title" th:text="#{migration.review.summary.heading}">Summary</h5>
                            <div class="detail-list">
                                <div class="detail-row">
                                    <span class="detail-label" th:text="#{migration.review.summary.uploaded}">Uploaded</span>
                                    <span class="detail-value" th:text="${uploaded}"></span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label" th:text="#{migration.review.summary.manual}">Manual</span>
                                    <span class="detail-value" th:text="${manualCreated}"></span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label" th:text="#{migration.review.summary.skipped}">Skipped</span>
                                    <span class="detail-value" th:text="${skippedByUser}"></span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label" th:text="#{migration.review.summary.failed}">Failed</span>
                                    <span class="detail-value" th:text="${failed}"></span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label" th:text="#{migration.review.summary.remaining}">Remaining</span>
                                    <span class="detail-value" th:text="${remaining}"></span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label" th:text="#{migration.review.summary.total}">Total</span>
                                    <span class="detail-value" th:text="${total}"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div th:if="${not #lists.isEmpty(failures)}" class="card mb-4">
                        <div class="card-body">
                            <h5 class="card-title" th:text="#{migration.review.summary.failuresHeading}">Failures</h5>
                            <ul class="mb-0">
                                <li th:each="failure : ${failures}" th:utext="${failure}"></li>
                            </ul>
                        </div>
                    </div>

                    <a th:if="${remaining > 0}" class="btn btn-primary mt-3" th:href="@{/migration/review}"
                       th:text="#{migration.review.summary.continueReview}">Continue review</a>

                </div>

            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"/>

</body>
</html>
