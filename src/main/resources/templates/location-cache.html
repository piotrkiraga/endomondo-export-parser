<html xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head(#{title.locationCache})}"></head>
<body>

<div th:replace="~{fragments/header :: header(#{title.locationCache})}"/>

<section class="my-5">
    <div class="container">
        <div class="row">
            <div class="col-md-10 mx-auto">

                <span th:replace="~{fragments/messages-errors}"/>

                <div class="mb-4">
                    <span th:replace="~{fragments/strava-status :: strava-status}"/>
                </div>

                <p class="lead" th:text="#{locationCache.description}">
                    Every coordinate the location cache has resolved, and the place it resolved to.
                </p>

                <div class="card">
                    <div class="card-body">

                        <h5 class="card-title" th:text="#{locationCache.heading}">Resolved coordinates</h5>

                        <div th:if="${#maps.isEmpty(entries)}" class="text-body-secondary"
                             th:text="#{locationCache.empty}">
                            No locations cached yet.
                        </div>

                        <table th:unless="${#maps.isEmpty(entries)}" class="table table-sm">
                            <thead>
                            <tr>
                                <th th:text="#{locationCache.latitude}">Latitude</th>
                                <th th:text="#{locationCache.longitude}">Longitude</th>
                                <th th:text="#{locationCache.place}">Place</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="entry : ${entries}">
                                <td th:text="${entry.key.latitude}">50.061</td>
                                <td th:text="${entry.key.longitude}">19.937</td>
                                <td th:text="${entry.value}">Dębniki, Kraków, Poland</td>
                            </tr>
                            </tbody>
                        </table>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"/>

</body>
</html>
