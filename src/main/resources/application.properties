

spring.security.user.name=piotr
spring.security.user.password=password

spring.devtools.add-properties=false

spring.mvc.locale-resolver=accept_header
spring.mvc.locale=en

spring.messages.basename=messages,version

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Where the unpacked Endomondo GDPR export lives; git-ignored personal data, override
# per machine if it lives elsewhere.
endomondo.archive.root=data/endomondo-strava-exports/endomondo-2020-11-01
# Where the photo handout report (index.html + geotagged copies) is written and served from.
endomondo.photo-report.output-directory=data/photo-report

# Must exactly match a redirect URI Strava will accept for your API application (its
# "Authorization Callback Domain" setting must cover this host); override if the app
# doesn't run on localhost:8080.
endomondo.strava.redirect-uri=http://localhost:8080/strava/callback

# JSP view resolver configuration - also defined in ApplicationCOnfiguration#jspViewResolver()
#spring.mvc.view.prefix=/WEB-INF/views/
#spring.mvc.view.suffix=.jsp

# Thymeleaf views
#spring.thymeleaf.prefix=classpath:/templates-2/

spring.mvc.log-request-details=true

logging.level.root=INFO
logging.level.console=DEBUG
logging.level.web=DEBUG
logging.level.pl.kiraga=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web.servlet.i18n=DEBUG
logging.level.org.springframework.web=DEBUG
