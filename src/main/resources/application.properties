

spring.devtools.add-properties=false

# Optional git-ignored file for local secrets (Strava credentials); see
# application-local.properties.example. Silently skipped if absent, e.g. in CI, where
# STRAVA_CLIENT_ID/SECRET can still be supplied as plain environment variables instead —
# both land in the same Spring Environment, so nothing else needs to know which was used.
spring.config.import=optional:file:./application-local.properties

spring.mvc.locale-resolver=accept_header
spring.mvc.locale=en

spring.messages.basename=messages,version

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Where the unpacked Endomondo GDPR export lives; git-ignored personal data, override
# per machine if it lives elsewhere.
endomondo.archive.root=data/endomondo-strava-exports/endomondo-2020-11-01
# Where the photo handout report (index.html + geotagged copies) is written and served from.
endomondo.photo-report.output-directory=data/generated/photo-report
# Where the workout migration preview report (index.html only, no images) is written and served from.
endomondo.workout-report.output-directory=data/generated/workout-report

# Must exactly match a redirect URI Strava will accept for your API application (its
# "Authorization Callback Domain" setting must cover this host); override if the app
# doesn't run on localhost:8080.
endomondo.strava.redirect-uri=http://localhost:8080/strava/callback

# Global timeouts for every auto-configured RestClient.Builder (Nominatim, Overpass, Strava).
# Without these, a single hung OSM connection can block a request thread indefinitely (found
# 2026-07-20 generating the workout report over the full archive). 30s clears Overpass's own
# 25s server-side execution budget (see OverpassClient's query).
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=30s

# Optional gear correction for old Rides (personal account data, so set in
# application-local.properties like the Strava credentials above, not here — see
# application-local.properties.example for what these do and why). Both unset by
# default: no gear_id is ever sent, i.e. every Ride keeps Strava's own default-gear
# assignment, same as before this existed.
#endomondo.strava.old-bike-gear-id=
#endomondo.strava.old-bike-cutoff-date=

# Dev-mode only: logs every request/response body exchanged with Strava (method, URI,
# and body) under the "pl.kiraga.endomondoexportparser.service.StravaTraffic" logger
# at INFO. access_token/refresh_token/client_secret values are always redacted, whether
# in a query param or a JSON body field; the Authorization header itself is never logged
# at all. Off by default; enable in application-local.properties, not here.
endomondo.strava.log-traffic=false

# JSP view resolver configuration - also defined in ApplicationCOnfiguration#jspViewResolver()
#spring.mvc.view.prefix=/WEB-INF/views/
#spring.mvc.view.suffix=.jsp

# Thymeleaf views
#spring.thymeleaf.prefix=classpath:/templates-2/

spring.mvc.log-request-details=true

logging.level.root=INFO
logging.level.console=DEBUG
logging.level.web=DEBUG
logging.level.pl.kiraga=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web.servlet.i18n=DEBUG
logging.level.org.springframework.web=DEBUG
