schema: spec-driven

context: |
  Brownfield revival of a 2020-era hobby project (revived July 2026; original last
  commit Nov 2020).

  Tech stack: Java 17, Spring Boot 4.1.0 (on Spring Framework 7; Jackson 3 for JSON),
  Maven (mvnw wrapper), Thymeleaf, Spring Security, executable jar packaging.
  Package root: pl.kiraga.endomondoexportparser.

  Domain: parsing personal Endomondo activity export files (JSON workouts, TCX) and
  migrating them to Strava. Endomondo shut down in 2020, so the input formats are
  frozen — golden-file/regression tests are the safety net.

  Known state: the JSON parser (EndomondoJsonParser service, merge-then-bind on
  Jackson 3) parses real export files correctly, covered by a regression suite.
  Personal export data lives in git-ignored data/ and must never be committed — use
  small anonymized fixtures under src/test/resources/fixtures/ instead.

  Conventions: keep changes small and sequential. Use full product names in
  documentation (Spring Boot 4.1, Spring Framework 7, Jackson 3) — never bare
  shorthand like "Boot" or "Framework 7" without the product name.

  Package layout is by technical layer under pl.kiraga.endomondoexportparser, not
  by feature: controller/ (Spring MVC), service/ (@Service/@Component beans —
  clients, resolvers, generators, stores, caches, orchestration), model/ (internal
  domain records/enums), dto/ (records mirroring an external wire format — Strava's
  API, Endomondo's export JSON), util/ (stateless/static helpers), exception/,
  configuration/. Naming: dto/ classes get a Dto suffix, util/ classes get a Util
  suffix; model/ and service/ classes stay bare (no Model/Service suffix) since the
  package already conveys the role — a class only needs a suffix when its package
  alone wouldn't say what it is (e.g. a Strava DTO vs. a Strava service).

rules:
  proposal:
    - Always include a "Non-goals" section
    - State which existing behavior must be preserved (characterization) vs. changed
  tasks:
    - Each task must be independently verifiable with a build/test command
